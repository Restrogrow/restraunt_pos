<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RestroGrow – all layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f5f7; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #e53935; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Poppins', system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; font-weight: 800; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  header nav { margin-left: auto; display: flex; gap: 8px; }
  header a { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; }
  header a:hover { border-color: var(--accent); color: var(--accent); }
  section { padding: 24px; }
  section h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
  section > p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(392px, 1fr)); gap: 22px; }
  figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 6px 20px rgba(17,24,39,0.06); }
  figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  figcaption b { font-size: 15px; }
  figcaption span { font-size: 12px; color: var(--muted); }
  figcaption a { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; }
  iframe { display: block; width: 390px; max-width: 100%; height: 720px; margin: 0 auto; border: 0; background: #fff; }
</style>
</head>
<body>
<header>
  <div>
    <h1>All layouts</h1>
    <p>Preview only: nothing here changes your saved settings.</p>
  </div>
  <nav><a href="#home">Home page dishes (10)</a><a href="#menu">Menu page cards (9)</a></nav>
</header>

<section id="home">
  <h2>Home Page Dishes</h2>
  <p>Website Appearance → Home Page Dishes. Each frame scrolls to the dish list.</p>
  <div class="grid" id="homeGrid"></div>
</section>

<section id="menu">
  <h2>Menu Card Design</h2>
  <p>Website Appearance → Menu Card Design.</p>
  <div class="grid" id="menuGrid"></div>
</section>

<script>
  // Site path comes from the dashboard link (?site=/<base>/<slug>); same-origin paths only
  var base = new URLSearchParams(location.search).get('site') || '';
  if (!/^\/[A-Za-z0-9_\/-]*$/.test(base)) base = '/';
  base = base.replace(/\/+$/, '');
  var home = [
    ['classic', 'Classic', 'rows with a photo (default)'], ['grid', 'Grid', '2 cards per row'], ['big', 'Big photo', 'one large photo per dish'],
    ['compact', 'Compact', 'short rows for long menus'], ['carousel', 'Carousel', 'each category scrolls sideways'], ['magazine', 'Magazine', 'zig-zag cards'],
    ['printed', 'Printed menu', 'name ····· price, no photos'], ['tiles', 'Tiles', '3 per row, name on the photo'], ['delivery', 'Delivery app', 'photo on the right with ADD'],
    ['dark', 'Dark', 'dish list in dark mode']
  ];
  var menu = [
    ['classic', 'Classic', 'original cards'], ['modern', 'Modern', 'wide photo + quantity picker'], ['minimal', 'Minimal', 'clean photo, round +'],
    ['photo', 'Photo', 'name over a big photo'], ['list', 'List', 'one per row with description'], ['elegant', 'Elegant', 'round plate photo, cream card'],
    ['compact', 'Compact', '3 small dishes per row'], ['midnight', 'Midnight', 'dark, glowing price'], ['showcase', 'Showcase', 'one big photo per row']
  ];
  function card(grid, src, name, note, scrollToList) {
    var fig = document.createElement('figure');
    fig.innerHTML = '<figcaption><div><b>' + name + '</b> <span>' + note + '</span></div><a href="' + src + '" target="_blank" rel="noopener">Open ↗</a></figcaption>';
    var f = document.createElement('iframe');
    f.loading = 'lazy';
    f.title = name;
    f.src = src;
    if (scrollToList) f.addEventListener('load', function() {
      setTimeout(function() {
        try {
          var w = f.contentWindow, el = w.document.getElementById('menuList');
          if (el) w.scrollTo(0, w.scrollY + el.getBoundingClientRect().top - 70);
        } catch (e) {}
      }, 1800);
    });
    fig.appendChild(f);
    grid.appendChild(fig);
  }
  home.forEach(function(h) { card(document.getElementById('homeGrid'), base + '?preview_home=' + h[0], h[1], h[2], true); });
  menu.forEach(function(m) { card(document.getElementById('menuGrid'), base + '/menu?preview_card=' + m[0], m[1], m[2], false); });
</script>
</body>
</html>
