<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">A pie chart showing the share of each order that goes to delivery app commission</title>
  <desc id="d">Cover image for the RestroGrow blog post "Zomato Commission Every Fee Explained". Illustration by RestroGrow (restrogrow.com).</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF6F1"/><stop offset="1" stop-color="#FFF1E8"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="330" r="270" fill="#FFE3D5"/>
  <rect x="0" y="0" width="16" height="630" fill="#FC5301"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="80" y="118" width="193" height="44" rx="22" fill="#FC5301"/>
    <text x="92" y="148" font-size="21" font-weight="700" fill="#fff">Delivery apps</text>
    <text x="80" y="258" font-size="58" font-weight="800" fill="#00000C">Zomato Commission</text><text x="80" y="340" font-size="58" font-weight="800" fill="#00000C">Every Fee Explained</text>
    <rect x="80" y="424" width="90" height="8" rx="4" fill="#FC5301"/>
    <text x="80" y="560" font-size="26" font-weight="800" fill="#00000C">Restro<tspan fill="#FC5301">Grow</tspan></text>
    <text x="232" y="560" font-size="26" fill="#555">Blog</text>
    <g transform="translate(910 310)" filter="url(#sh)"><circle r="170" fill="#fff"/><path d="M0 0 L0 -170 A170 170 0 0 1 150 -80 Z" fill="#FC5301"/><circle r="74" fill="#FBF6F1"/><text y="-4" text-anchor="middle" font-size="38" font-weight="800" fill="#00000C">8–28%</text><text y="30" text-anchor="middle" font-size="18" fill="#555">commission</text></g>
    <text id="rg-brand" x="1172" y="606" text-anchor="end" font-size="20" font-weight="600" fill="#00000C" fill-opacity="0.55">restrogrow.com</text>
  </g>
