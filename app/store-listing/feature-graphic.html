<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Poppins,sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(120deg,#ff6a1a 0%,#f2541b 55%,#d9431a 100%)}
.bg:after{content:"";position:absolute;right:-120px;top:-160px;width:620px;height:620px;border-radius:50%;background:rgba(255,255,255,.08)}
.left{position:absolute;left:64px;top:70px;width:520px;color:#fff}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.brand img{width:72px;height:72px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.brand b{font-size:30px;font-weight:800;letter-spacing:.3px}
.brand span{display:block;font-size:15px;font-weight:500;letter-spacing:4px;opacity:.9}
h1{font-size:44px;line-height:1.12;margin:0 0 18px;font-weight:800}
p{font-size:19px;margin:0;opacity:.95;font-weight:500}
.phone{position:absolute;right:70px;top:46px;width:250px;height:520px;border-radius:38px;background:#1d1d24;padding:10px;box-shadow:0 24px 50px rgba(0,0,0,.35);transform:rotate(-6deg)}
.phone img{width:100%;border-radius:30px;display:block}
</style></head><body><div class="bg"></div>
<div class="left">
 <div class="brand"><img src="../assets/icon.png"><div><b>Restrogrow</b><span>PARTNER</span></div></div>
 <h1>Run your restaurant from your phone</h1>
 <p>Orders · Kitchen · Tables · Billing · Reports</p>
</div>
<div class="phone"><img src="screenshot-1-home.png"></div>
</body></html>
