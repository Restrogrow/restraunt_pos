function getQty(catIdx, idx) {
  var key = catIdx + '-' + idx;
  return cartItems[key] || 0;
}

function renderCartBtn(catIdx, idx) {
  var qty = getQty(catIdx, idx);
  if (qty === 0) {
    return '<button class="add-btn" onclick="event.stopPropagation();addToCart(' + catIdx + ',' + idx + ')">Add To Cart</button>';
  }
  return '<div class="qty-inline">' +
    '<button onclick="event.stopPropagation();removeFromCart(' + catIdx + ',' + idx + ')"><i class="fa fa-minus"></i></button>' +
    '<span class="qty-num">' + qty + '</span>' +
    '<button onclick="event.stopPropagation();addToCart(' + catIdx + ',' + idx + ')"><i class="fa fa-plus"></i></button>' +
  '</div>';
}

function addToCart(catIdx, idx) {
  var key = catIdx + '-' + idx;
  cartItems[key] = (cartItems[key] || 0) + 1;
  var el = document.getElementById('btn-' + catIdx + '-' + idx);
  if (el) el.innerHTML = renderCartBtn(catIdx, idx);
  saveCart();
}

function removeFromCart(catIdx, idx) {
  var key = catIdx + '-' + idx;
  if (cartItems[key] > 0) cartItems[key]--;
  var el = document.getElementById('btn-' + catIdx + '-' + idx);
  if (el) el.innerHTML = renderCartBtn(catIdx, idx);
  saveCart();
}

function saveCart() {
  try { localStorage.setItem('dvaniCart', JSON.stringify(cartItems)); } catch(e) {}
}

function loadCart() {
  try {
    var saved = localStorage.getItem('dvaniCart');
    if (saved) { cartItems = JSON.parse(saved); }
  } catch(e) {}
}

function renderProducts(catIdx) {
  var cat = allMenuData[catIdx];
  if (!cat) return;
  currentCategory = cat.name;
  var el = document.getElementById('productGrid');
  var titleEl = document.getElementById('categoryTitle');
  var breadcrumbEl = document.getElementById('breadcrumb');
  var displayName = cat.name.replace(/ \(.*\)/, '');
  titleEl.textContent = displayName + ' (' + cat.count + ')';
  breadcrumbEl.innerHTML = '<span>' + displayName + '</span>';
  var html = '';
  for (var i = 0; i < cat.items.length; i++) {
    var item = cat.items[i];
    html += '<div class="card" onclick="showItemDetail(' + catIdx + ',' + i + ')">' +
      '<div class="card-img-wrap">' +
        '<img src="' + item.image + '" alt="' + item.name + '" loading="lazy">' +
        '<div class="veg-dot"><img src="https://knowwu.s3.us-east-2.amazonaws.com/staging/main/restaurant/veg.png" alt="Veg"></div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-name">' + item.name + '</div>' +
        '<div class="card-price">' + item.price + '</div>' +
        '<span id="btn-' + catIdx + '-' + i + '">' + renderCartBtn(catIdx, i) + '</span>' +
      '</div>' +
    '</div>';
  }
  el.innerHTML = html;
  updateNavActive(catIdx);
}

function showItemDetail(catIdx, idx) {
  var cat = allMenuData[catIdx];
  if (!cat) return;
  var item = cat.items[idx];
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:360px;width:90%;overflow:hidden;animation:slideUp 0.25s;position:relative">' +
    '<button onclick="this.closest(\'div[style]\').remove()" style="position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,0.5);color:#fff;font-size:18px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center"><i class="fa fa-times"></i></button>' +
    '<img src="' + item.image + '" alt="' + item.name + '" style="width:100%;height:220px;object-fit:cover;display:block">' +
    '<div style="padding:16px 20px 20px">' +
      '<h3 style="font-size:18px;font-weight:700;color:#1a1b1f;margin:0 0 4px">' + item.name + '</h3>' +
      '<div style="font-size:20px;font-weight:700;color:#1a3934;margin:8px 0 14px">' + item.price + '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button onclick="var p=this.closest(\'[style]\').querySelector(\'[id^=btn-]\');if(p){var a=p.id.split(\'-\');addToCart(parseInt(a[1]),parseInt(a[2]));this.closest(\'[style]\').remove()}" style="flex:1;padding:10px;border:none;border-radius:8px;background:linear-gradient(to right,#846241,#1a3934);color:#fff;font-size:14px;font-family:\'Poppins\',sans-serif;font-weight:600;cursor:pointer">Add to Cart</button>' +
      '</div>' +
    '</div>' +
  '</div>';
  document.body.appendChild(overlay);
  var style = document.createElement('style');
  style.textContent = '@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}';
  document.head.appendChild(style);
}

function updateNavActive(catIdx) {
  var btns = document.querySelectorAll('.side-nav-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (parseInt(btns[i].dataset.index) === catIdx) {
      btns[i].classList.add('active');
    }
  }
}

function renderSideNav() {
  var el = document.getElementById('sideNav');
  var html = '';
  for (var i = 0; i < allMenuData.length; i++) {
    var c = allMenuData[i];
    var active = i === 0 ? ' active' : '';
    html += '<div class="sub-views">' +
      '<button class="side-nav-btn' + active + '" data-index="' + i + '">' +
        '<img src="' + c.image + '" alt="' + c.name + '" loading="lazy"><br>' + c.name.replace(/ \(.*\)/, '') +
      '</button>' +
    '</div>';
  }
  el.innerHTML = html;
}

function switchCategory(catIdx) {
  renderProducts(catIdx);
}

function toggleSearch() {
  var el = document.querySelector('.search-rapper');
  var icon = document.getElementById('fabIcon');
  el.classList.toggle('show');
  if (el.classList.contains('show')) {
    icon.className = 'bi bi-x';
    icon.style.color = '#ff4444';
    setTimeout(function() { el.querySelector('.search-input').focus(); }, 100);
  } else {
    icon.className = 'bi bi-search';
    icon.style.color = '';
  }
}

function goBack() {
  if (document.referrer && document.referrer.includes(window.location.host)) {
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
}

function getQueryParam(name) {
  var url = new URL(window.location.href);
  return url.searchParams.get(name);
}

loadCart();
document.addEventListener('DOMContentLoaded', function() {
  renderSideNav();
  var catParam = getQueryParam('cat');
  var startIdx = 0;
  if (catParam) {
    for (var i = 0; i < allMenuData.length; i++) {
      if (allMenuData[i].name === catParam) { startIdx = i; break; }
    }
  }
  renderProducts(startIdx);
  document.getElementById('sideNav').addEventListener('click', function(e) {
    var btn = e.target.closest('.side-nav-btn');
    if (btn) switchCategory(parseInt(btn.dataset.index));
  });
  var searchInput = document.querySelector('.search-input');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      var q = this.value.toLowerCase().trim();
      var cards = document.querySelectorAll('.card');
      for (var i = 0; i < cards.length; i++) {
        var name = cards[i].querySelector('.card-name');
        if (name) {
          cards[i].style.display = name.textContent.toLowerCase().includes(q) ? '' : 'none';
        }
      }
    });
  }
});
</script>
</body>
</html>
